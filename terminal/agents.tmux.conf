# The private tmux server behind adaptive-agent (agy, claude, codex).
# Installed as ~/.config/karthi-shell/agents.tmux.conf. It is meant to be
# invisible: no status line and no prefix key, so every key - Ctrl+B
# included - reaches the agent. Closing the window only detaches.

set -g prefix None
unbind C-b
set -g status off
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys"
set -s extended-keys on

# The laptop and the phone can show one session at once: it takes the size
# of whichever was used last.
set -g window-size latest
set -g aggressive-resize on

# A session keeps the laptop environment it was started with; attaching from
# the phone must not hand the phone's display or bus to new shells.
set -g update-environment ""

# The wheel scrolls back through the conversation; a drag copies to the
# laptop's clipboard (Shift+drag selects in the terminal itself).
set -g mouse on
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode Escape send -X cancel
