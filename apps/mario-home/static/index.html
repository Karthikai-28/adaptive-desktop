<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mario</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/home.css">
</head>
<body>
<!-- Icons: one stroke set, used by id -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9c0 4-6 3-11 8"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-apps" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4zM19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></symbol>
  <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
  <symbol id="i-shot" viewBox="0 0 24 24"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M2 13v2M22 13v2"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5M8 16h3"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 19h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 19z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></symbol>
  <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 15zM8 18l-1 3M12 18l-1 3M16 18l-1 3"/></symbol>
</svg>

<!-- Home: the desktop layer. The shell's top bar and rail stay the shell's. -->
<main id="home" class="home">
  <header class="top">
    <div class="greet"><h1 id="greeting">Hello</h1><span id="date" class="muted"></span></div>
    <form id="ask-form" class="ask" autocomplete="off">
      <span class="mark" data-state="ready" aria-hidden="true"><svg viewBox="0 0 44 24"><path class="s1" d="M2 12C10 3 18 21 26 12S38 3 42 12"/><path class="s2" d="M2 12C10 21 18 3 26 12S38 21 42 12"/><path class="s3" d="M2 12H42"/></svg><i class="shuttle"></i></span>
      <label for="ask" class="sr">Ask Mario</label>
      <input id="ask" placeholder="Ask Mario: your day, mail, repos, anything">
      <span id="brain" class="pill" title="Where Mario answers from">local first</span>
      <kbd>Super J</kbd>
      <div id="answer" class="answer" hidden></div>
    </form>
  </header>

  <div class="dayhead">
    <h2>Your day</h2>
    <span id="daysum" class="muted"></span>
    <span class="chips">
      <button class="chip" data-ask="Brief me">Brief me</button>
      <button class="chip" data-ask="What changed today?">What changed</button>
      <button class="chip" data-ask="Plan my tomorrow from my calendar, tasks and repos">Plan tomorrow</button>
    </span>
  </div>

  <div class="main">
    <div class="left">
      <div class="row r3">
        <section class="card" id="c-mail"><header class="ch"><svg class="ci"><use href="#i-mail"/></svg><h3>Mail</h3><span class="count"></span><button class="open" type="button" data-open="https://mail.google.com/" aria-label="Open Gmail"><svg><use href="#i-out"/></svg></button></header><div class="body"></div></section>
        <section class="card" id="c-today"><header class="ch"><svg class="ci"><use href="#i-cal"/></svg><h3>Today</h3><span class="count"></span><button class="open" type="button" data-open="https://calendar.google.com/" aria-label="Open Google Calendar"><svg><use href="#i-out"/></svg></button></header><div class="body"></div></section>
        <section class="card" id="c-tasks"><header class="ch"><svg class="ci"><use href="#i-check"/></svg><h3>Tasks</h3><span class="count"></span></header><div class="body"></div></section>
      </div>
      <div class="grid4">
        <section class="card narrow" id="c-projects"><header class="ch"><svg class="ci"><use href="#i-branch"/></svg><h3>Projects</h3><span class="dots"></span></header><div class="body"></div></section>
        <section class="card wide" id="c-thinking"><header class="ch"><svg class="ci"><use href="#i-layers"/></svg><h3>Thinking Space</h3><span class="count"></span><button class="open" type="button" data-open-hub aria-label="Open the Thinking Space hub"><svg><use href="#i-out"/></svg></button></header><div class="body"></div></section>
        <section class="card tall" id="c-news"><header class="ch"><svg class="ci"><use href="#i-news"/></svg><h3>News</h3><span class="meta" id="news-src"></span></header><div class="body"></div><i class="roll" aria-hidden="true"></i></section>
        <section class="card narrow" id="c-recent"><header class="ch"><svg class="ci"><use href="#i-file"/></svg><h3>Recent files</h3><span class="dots"></span></header><div class="body"></div></section>
        <section class="card narrow" id="c-note"><header class="ch"><svg class="ci"><use href="#i-pen"/></svg><h3>Quick note</h3></header><div class="body"></div></section>
        <section class="card narrow" id="c-week"><header class="ch"><svg class="ci"><use href="#i-chart"/></svg><h3>This week</h3><span class="dots"></span></header><div class="body"></div></section>
      </div>
    </div>

    <aside class="side">
      <section class="card compact" id="c-weather"><div class="body"></div></section>
      <section class="card" id="c-apps"><header class="ch"><svg class="ci"><use href="#i-apps"/></svg><h3>Apps</h3></header>
        <div class="apps">
          <button class="app" type="button" data-launch="terminal"><svg><use href="#i-term"/></svg>Terminal</button>
          <button class="app" type="button" data-launch="files"><svg><use href="#i-folder"/></svg>Files</button>
          <button class="app" type="button" data-launch="code"><svg><use href="#i-code"/></svg>Code</button>
          <button class="app" type="button" data-launch="browser"><svg><use href="#i-globe"/></svg>Browser</button>
          <button class="app" type="button" data-launch="settings"><svg><use href="#i-gear"/></svg>Settings</button>
          <button class="app" type="button" data-launch="calculator"><svg><use href="#i-calc"/></svg>Calculator</button>
          <button class="app" type="button" data-launch="screenshot"><svg><use href="#i-shot"/></svg>Screenshot</button>
          <button class="app" type="button" data-launch="monitor"><svg><use href="#i-pulse"/></svg>System Monitor</button>
        </div>
      </section>
      <section class="card" id="c-ai"><header class="ch"><svg class="ci"><use href="#i-spark"/></svg><h3>AI assistants</h3></header><div class="body"></div></section>
      <button class="card compact row-card" id="c-phone" type="button"><svg class="ci"><use href="#i-phone"/></svg><span class="body"></span><svg class="chev"><use href="#i-chev"/></svg></button>
    </aside>
  </div>
</main>

<!-- Panel: Super+J opens this page at /panel in its own window -->
<section id="panel" class="panel" hidden>
  <header class="panel-head">
    <span class="mark big" data-state="ready" aria-hidden="true"><svg viewBox="0 0 44 24"><path class="s1" d="M2 12C10 3 18 21 26 12S38 3 42 12"/><path class="s2" d="M2 12C10 21 18 3 26 12S38 21 42 12"/><path class="s3" d="M2 12H42"/></svg><i class="shuttle"></i></span>
    <div><div class="title">Mario</div><div class="muted" id="panel-sub">answers locally first</div></div>
  </header>
  <div id="log" class="log" aria-live="polite"></div>
  <form id="panel-form" class="composer" autocomplete="off">
    <label for="panel-input" class="sr">Message Mario</label>
    <input id="panel-input" placeholder="Message Mario">
    <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
</section>

<div id="offline" class="offline" hidden>Mario Hub is not answering. Retrying…</div>
<script src="/static/home.js"></script>
</body>
</html>
